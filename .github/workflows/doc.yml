# Build the Ocsigen tutorial with odoc, theme it with the Ocsigen chrome (wodoc),
# and publish it on the project's gh-pages branch, served at
# https://ocsigen.org/tuto/. See doc/README.md.
#
# tuto is MANUAL-ONLY (no library/API): wodoc drives odoc directly on the .mld
# pages (direct-mld mode). Unlike the API projects, its versions (9.0, 8.0, dev)
# are DISTINCT manuals living in master as tutos/<v>/manual/, so the CI builds
# ALL of them (passing the per-version mld-dir and nav file) rather than
# freezing dev.
name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# Serialise gh-pages writes: a push and a manual run must never push to
# gh-pages at the same time, or the second push fails non-fast-forward.
concurrency:
  group: doc-deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-deploy:
    if: github.repository == 'ocsigen/tuto'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.0"

      # tuto is manual-only: the whole install is just wodoc + odoc, compiled from
      # source (~3.5 min) on every push, while the actual doc build takes seconds.
      # setup-ocaml only caches the base switch (the compiler), so cache the whole
      # _opam switch keyed on wodoc's HEAD commit; a cache hit skips the install,
      # and the key changes (rebuild once) only when wodoc moves.
      - name: Resolve wodoc HEAD commit
        id: wodoc
        run: echo "sha=$(git ls-remote https://github.com/ocsigen/wodoc.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache the opam switch (wodoc + odoc)
        id: switch-cache
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-switch-${{ runner.os }}-ocaml5.4.0-wodoc-${{ steps.wodoc.outputs.sha }}

      - name: Install wodoc and odoc
        if: steps.switch-cache.outputs.cache-hit != 'true'
        run: |
          opam pin add -n wodoc https://github.com/ocsigen/wodoc.git
          opam install wodoc odoc

      - name: Build documentation (9.0, 8.0, dev)
        # 9.0 is the latest version: with --latest, wodoc writes the `latest`
        # symlink and the project-root files (the index.html redirect to latest/,
        # the 404.html that sends a missing page to its version's index, and
        # versions.json, which drives the in-page version <select> and which the
        # dev build refreshes). .nojekyll so GitHub Pages serves the odoc output
        # verbatim (underscored dirs, no Jekyll build). The site goes to
        # _doc-site/tuto/, as on ocsigen.org, so that the next step can lay out
        # the other projects next to it.
        run: |
          for v in 9.0 8.0 dev; do
            latest=
            if [ "$v" = 9.0 ]; then latest=--latest; fi
            opam exec -- wodoc build --config doc/wodoc \
              --menu https://ocsigen.org/doc/menu.html \
              --out "$PWD/_doc-site/tuto/$v" --label "$v" \
              --mld-dir "tutos/$v/manual" --nav "tutos/$v/manual/nav" \
              --strict-refs $latest
            # manual-only: the version landing redirects to the first page (intro)
            printf '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=intro.html">\n' \
              > "_doc-site/tuto/$v/index.html"
          done
          touch _doc-site/tuto/.nojekyll

      - name: Requalify links into wrapped projects
        # A manual written against an older release names modules by their flat
        # name (Eliom_registration), but the current release deploys them under
        # its wrapper (Eliom/Registration), so these links miss. requalify-xrefs
        # rewrites each one to the wrapped path whose target exists. It probes
        # the target trees next to ours: lay out the deployed `latest` and `dev`
        # of each wrapped project, as empty files since only their existence is
        # checked, then rewrite tuto's pages in place. Any failure stops the job
        # before the deploy, which keeps the published site as it is.
        shell: bash
        run: |
          for p in eliom ocsigen-toolkit ocsigen-start ocsigenserver; do
            g="$RUNNER_TEMP/gh-pages-$p"
            git clone --quiet --depth 1 --filter=blob:none --no-checkout \
              --branch gh-pages "https://github.com/ocsigen/$p.git" "$g"
            # `latest` must be a symlink to a version directory
            git -C "$g" ls-tree HEAD latest | grep -q '^120000 '
            latest=$(git -C "$g" cat-file -p HEAD:latest)
            [[ "$latest" =~ ^[0-9A-Za-z_-][0-9A-Za-z._-]*$ ]]
            mkdir -p "_doc-site/$p"
            ln -s "$latest" "_doc-site/$p/latest"
            git -C "$g" ls-tree -r -z --name-only HEAD -- "$latest" dev > "$g.files"
            (cd "_doc-site/$p" &&
             sed -z 's|/[^/]*$||' "$g.files" | sort -zu | xargs -0 mkdir -p &&
             xargs -0 touch < "$g.files")
          done
          opam exec -- wodoc requalify-xrefs --site _doc-site \
            --wrapped eliom=Eliom --wrapped ocsigen-toolkit=Ot \
            --wrapped ocsigen-start=Os --wrapped ocsigenserver=Ocsigen

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _doc-site/tuto
          clean: true
